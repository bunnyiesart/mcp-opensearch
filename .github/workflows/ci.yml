name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The matrix includes 3.10 on purpose. pyproject.toml declares
  # requires-python = ">=3.10" and ships a "Programming Language :: Python :: 3.10"
  # classifier, so 3.10 is a promise to users. An untested floor is an unverified
  # promise — if the code ever grows 3.11+ syntax, this job is what catches it.
  # (The sibling `swiss` project runs 3.11/3.12/3.13 because it declares no 3.10
  # support; the matrix should follow the declared floor, not be copied across.)
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest --tb=short -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned on purpose. An unpinned `pip install ruff` made this job's meaning
      # change with every ruff release — the rule set broadened and the job went
      # red with no code change. Bump this deliberately, as its own commit, so a
      # new finding is never confused with a new tool version.
      - name: Install ruff
        run: pip install "ruff==0.16.2"

      - name: Lint
        run: ruff check .
