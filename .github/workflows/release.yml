name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  # The tag-versus-pyproject.toml invariant lives here and only here. Both
  # publish jobs depend on it, so a mismatched tag blocks the PyPI package and
  # the container image together — previously the docker job had no gate and
  # would move :latest onto code that self-reports a different version.
  # Same single-source-of-truth principle as docs/adr/0003.
  version:
    name: Verify tag matches pyproject.toml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version matches tag
        id: check
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION pyproject.toml=$PKG_VERSION" >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches pyproject.toml version $PKG_VERSION"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"

  pypi:
    name: Publish to PyPI
    needs: version
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install hatch
          hatch build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    name: Push Docker image to GHCR
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
